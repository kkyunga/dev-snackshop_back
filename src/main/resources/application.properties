server.port=9080
server.servlet.context-path=/api
spring.application.name=dev-snackshop_back

# JPA Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====== Kafka Settings ========
# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Reliability & Safety Settings
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Hibernate 6.0+ automatically detects PostgreSQL Dialect (Optional)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# OSIV (Open Session In View) disabled for performance (Recommended)
spring.jpa.open-in-view=false

# Consumer Configuration
spring.kafka.consumer.group-id=monitor-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trusted packages for JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=org.back.devsnackshop_back.dto.kafka
# ====== Kafka Settings ========

# Naming Strategy: PostgreSQL snake_case to Java camelCase mapping
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JWT Configuration (Must be handled as environment variables in production)
jwt.secret=c2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQtc2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQK
jwt.expiration=3600000

# Logging Configurations
logging.level.org.springframework.boot.devtools=info
# SQL Parameter Binding Logging (Trace level for debugging)
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.springframework.kafka.KafkaListenerEndpointContainer=ERROR

